[package]
name = "remotedesk"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
eframe = { version = "0.37", default-features = false, features = ["glow", "clipboard", "default_fonts"] }
enigo = "0.6"
iroh = "1.4"
jpeg-encoder = { version = "0.7", features = ["simd"] }
n0-future = "0.3"
openh264 = "0.9"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rfd = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_LibraryLoader"] }
winreg = "0.55"
xcap = { version = "0.9", default-features = false }
zune-jpeg = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.34"

# Optimise dependencies (OpenH264, JPEG, crypto) even in debug builds so dev tests run at
# realistic speed; our own crate stays fast to compile.
[profile.dev.package."*"]
opt-level = 3
